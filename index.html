<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SwiftCart</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>

  <!-- DaisyUI + Tailwind -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body class="m-0 p-0">

  <!-- ================= NAVBAR ================= -->
  <header class="absolute w-full z-50 bg-white">
    <div class="navbar px-6 text-black">

      <!-- Logo -->
      <div class="navbar-start">
        <a class="font-bold text-2xl text-blue-400">SwiftCart</a>
      </div>

      <!-- Desktop Menu -->
      <div class="navbar-center hidden lg:flex">
        <ul class="menu menu-horizontal px-1 gap-4">
          <li><a class="hover:text-blue-400">Home</a></li>
          <li><a class="hover:text-blue-400">Products</a></li>
          <li><a class="hover:text-blue-400">About</a></li>
          <li><a class="hover:text-blue-400">Contact</a></li>
        </ul>
      </div>

      <!-- Right Side -->
      <div class="navbar-end gap-4">

        <!-- Cart -->
        <i class="fa-solid fa-cart-shopping text-lg cursor-pointer"></i>

        <!-- Mobile Menu Button (Right Side) -->
        <div class="dropdown dropdown-end lg:hidden">
          <div tabindex="0" role="button" class="btn btn-ghost text-black">
            <i class="fa-solid fa-bars text-xl"></i>
          </div>
          <ul tabindex="0"
            class="menu menu-sm dropdown-content bg-base-100 text-black rounded-box mt-3 w-52 p-2 shadow">
            <li><a>Home</a></li>
            <li><a>Products</a></li>
            <li><a>About</a></li>
            <li><a>Contact</a></li>
          </ul>
        </div>

      </div>
    </div>
  </header>

  <!-- ================= HERO SECTION ================= -->
  <section class="relative h-screen w-full bg-cover bg-center"
    style="background-image: url('./Assets/banner-image.png');">

    <!-- Dark Overlay -->
    <div class="absolute inset-0 bg-black/60"></div>

    <!-- Content -->
    <div class="relative z-10 flex items-center h-full px-6 md:px-16">

      <div class="text-left max-w-xl">

        <h3 class="text-3xl md:text-5xl font-bold text-white mb-4">
          Best Collection For You
        </h3>

        <p class="text-base  text-gray-200 mb-6">
          Discover the latest trends in fashion, electronics, and more.
          Shop with <br>confidence and style at SwiftCart.
        </p>

        <button class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-lg font-semibold transition duration-300 shadow-lg">
          Shop Now
        </button>

      </div>

    </div>

  </section>

  

</body>
</html>
